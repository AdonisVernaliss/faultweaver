services:
  api:
    build:
      context: ./backend
    environment:
      FAULTWEAVER_DATABASE_URL: sqlite:////data/faultweaver.db
      FAULTWEAVER_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - faultweaver-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
    environment:
      FAULTWEAVER_API_URL: http://api:8000
      HOST: 0.0.0.0
      PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  faultweaver-data:
