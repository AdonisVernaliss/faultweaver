services:
  webgoat:
    image: webgoat/webgoat:v2026.4@sha256:d4ac9fc2b0a41b68d64dedde684f4783aa60cc785838435a6d5bd5a25b387497
    pull_policy: missing
    environment:
      TZ: Etc/UTC
      WEBGOAT_HOST: 0.0.0.0
      WEBGOAT_PORT: 8080
    ports:
      - "127.0.0.1:${FAULTWEAVER_WEBGOAT_PORT:-4080}:8080"
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /WebGoat/login HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q "200"'
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 15s
